[project]
name = "exchange"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "celery>=5.6.3",
    "django==4.2",
    "django-celery-beat>=2.9.0",
    "django-celery-results>=2.6.0",
    "django-environ>=0.13.0",
    "djangorestframework>=3.17.1",
    "environ>=1.0",
    "psycopg>=3.3.4",
    "psycopg2-binary>=2.9.12",
    "redis==7.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle、I: import 排序、UP: 語法現代化、DJ: Django 規則
select = ["E", "F", "I", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
# settings.py 內 Django 內建驗證器路徑字串過長,無法縮短
"exchange/settings.py" = ["E501"]
# migrations 為自動產生,排除 lint(仍會排版)
"**/migrations/*.py" = ["E501", "DJ", "I001"]

[tool.ruff.format]
quote-style = "double"
